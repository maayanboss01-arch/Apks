<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aayan APKs</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
<header class="header"><h1>Aayan APKs</h1><p>Apps & Games</p></header>

<section id="verifyScreen" class="card verify-card">
<div class="lock">🔐</div>
<h2>Verification Required</h2>
<p>Subscribe to my YouTube channel, then come back and press Verify.</p>
<button id="subscribeBtn" class="btn primary">Subscribe</button>
<button id="verifyBtn" class="btn secondary">Verify</button>
<p id="verifyMessage" class="message"></p>
</section>

<section id="appsScreen" class="hidden">
<div class="section-title"><h2>Available APKs</h2><p>Choose an app or game to download.</p></div>
<div id="appsList" class="apps-grid"></div>
</section>
</main>
<script src="apps.js"></script>
<script src="script.js"></script>
</body>
</html>
